name: younifirst_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  image_picker: ^1.0.7
    

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  dotted_border: ^3.1.0
  firebase_auth: ^5.7.0
  firebase_database: ^11.1.5
  provider: ^6.1.5+1
  file_picker: 8.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:

  assets: 
  - assets/images/Bintang.png
  - assets/images/Interaksi.png
  - assets/images/Lingkaran dalam.png
  - assets/images/Topi Wisuda.png
  - assets/images/Younifirst.png
  - assets/images/background_login.png
  - assets/images/icon_login.png
  - assets/images/item_login.png
  - assets/images/logo.png
  - assets/images/logo_putih.png
  - assets/images/logo_aplikasi.png

  uses-material-design: true
  
